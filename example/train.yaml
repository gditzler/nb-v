version: 1

mode: train
kmer_size: 9
save_dir: ./example/trained_output
source_dir: ./example/reads
threads: 4

input:
  extension: .fna
  input_type: fasta

memory:
  limit_mb: 0
  batch_size: 0
  max_rows: 450000
  max_cols: 20000

output:
  format: csv
  prefix: log_likelihood
  full_result: false
  temp_dir: /tmp
